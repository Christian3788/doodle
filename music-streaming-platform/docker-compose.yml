version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spotify_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: spotify_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spotify_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: spotify_s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: spotify_audio_backend
    restart: unless-stopped
    depends_on:
      - minio
    environment:
      PORT: "8080"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "us-east-1"
      S3_BUCKET: "spotify-audio"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "miniopassword"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spotify_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend-go:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/spotify_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXT_PUBLIC_STREAM_URL: "http://localhost:8080/stream"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8080/ws"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "super-secret-random-32-char-key-for-jwt-signing"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  miniodata: